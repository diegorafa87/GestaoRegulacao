{% extends 'base.html' %}
{% block title %}Login - Regulação Saúde{% endblock %}
{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/" style="font-weight: 700;">SIGA SAÚDE</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
      <a class="btn btn-outline-light btn-sm" href="/login">Entrar</a>
    </div>
  </div>
</nav>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='image_7426c3df.png') }}" alt="SIGA SAÚDE" style="max-width: 180px; width: 100%; height: auto; display: block; margin: 0 auto 16px;">
                    <h4 class="fw-bold text-primary mb-1">Acesso ao Sistema</h4>
                    <div class="text-muted small">Secretaria Municipal de Saúde de Fernando Pedroza</div>
                </div>
                <form method="post" class="d-grid gap-3">
                    <div>
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control preservar-caso" required autocomplete="username">
                    </div>
                    <div>
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
